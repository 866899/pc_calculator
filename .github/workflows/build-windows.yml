name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\windows -Recurse -Filter "pc_calculator.exe" | Select-Object -First 1
          if (-not $exe) { throw "pc_calculator.exe not found" }
          $releaseDir = Split-Path $exe.FullName
          Write-Host "Release dir: $releaseDir"
          "release_dir=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate.outputs.release_dir }}\*" -DestinationPath pc_calculator-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc_calculator-windows-x64
          path: pc_calculator-windows-x64.zip
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pc_calculator-windows-x64.zip
          generate_release_notes: true
